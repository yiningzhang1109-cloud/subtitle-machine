<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Subtitle Machine - AI Video Processing</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { 
            primary: { DEFAULT: '#003153', hover: '#001e33' },    /* 普鲁士蓝 */
            gold: { DEFAULT: '#E3C78F', bg: '#F0C239', light: '#FAF7F2' }, /* 高亮明黄大背景 #F0C239 */
            accent: { DEFAULT: '#85120F', hover: '#630d0b' }      /* 深红操作色 */
          },
          fontFamily: { 
            sans: ['Inter', 'sans-serif'], 
            mono: ['JetBrains Mono', 'monospace'] 
          },
          borderRadius: { 'custom': '16px' }
        }
      }
    }
  </script>
  <style data-purpose="custom-layouts">
    /* 主上传区虚线边框：普鲁士蓝 */
    .dashed-border { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23003153' stroke-width='1.5' stroke-dasharray='10%2c 10' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); border-radius: 16px; transition: all 0.3s ease;}
    /* 预览区虚线边框：沙金 */
    .dashed-border-gold { background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23E3C78F' stroke-width='1.5' stroke-dasharray='8%2c 8' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e"); border-radius: 16px; }
    
    /* 核心处理按钮深红柔光阴影 */
    .glow-button { box-shadow: 0 12px 30px -10px rgba(133, 18, 15, 0.5); }
    
    /* 自定义滑动开关（未激活沙金，激活深红） */
    .switch { position: relative; display: inline-block; width: 48px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #E3C78F; transition: .4s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #85120F; }
    input:checked + .slider:before { transform: translateX(24px); }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #E3C78F; border-radius: 4px; }
    
    /* 大风车自转动画 */
    .animate-spin-smooth { animation: spin 2s linear infinite; }
  </style>
</head>
<body class="bg-gold-bg font-sans text-primary min-h-screen flex flex-col">

  <header class="bg-white border-b border-gold/40 px-6 py-4 flex items-center justify-between sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M2 12a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V7h-5a8 8 0 0 0-5 2 8 8 0 0 0-5-2H2Z"></path></svg>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-primary">Subtitle Machine</h1>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full p-8">
    
    <section id="upload-box" class="dashed-border bg-white p-12 flex flex-col items-center justify-center text-center space-y-4 shadow-sm mb-8">
      <div class="w-16 h-16 bg-gold-light text-primary rounded-2xl flex items-center justify-center border border-gold/50">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke
